[project]
name = "mt-experiments"
version = "0.1.0"
description = "MAST tokamak equilibrium reconstruction experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.25",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "xarray>=2024.1",
    "zarr>=2.16",
    "h5py>=3.10",
    "netcdf4>=1.6",
    "fsspec>=2024.1",
    "aiohttp>=3.9",
    "s3fs>=2024.1",
    "freegsnke",
    "freegs4e>=0.12",
    "dask[distributed]>=2024.1",
    "bokeh>=3.1.0",
    "build>=1.5.0",
    "torch>=2.0",
    "huggingface-hub>=0.20",
    "seaborn>=0.13.2",
]

[project.scripts]
morph-gs-process-shot  = "morph_gs.process_shot:main"
morph-gs-build-dataset = "morph_gs.build_dataset:main"
morph-gs-train         = "morph_gs.train:main"
morph-gs-eval-pairs    = "morph_gs.eval:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
freegsnke = { path = "freegsnke" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
